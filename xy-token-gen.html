<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星羿 · 授权链接生成器（本机专用）</title>
<style>
  :root{ --main:#0fb5a6; --main2:#0a8f86; --ink:#16323a; --mut:#6b8790; --bg:#eef6f5; --red:#e05656; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#e9f6f4,#dff0ee);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(15,181,166,.15);
    width:100%;max-width:480px;padding:30px 26px}
  .logo{font-size:24px;font-weight:800;color:var(--main2)}
  .logo small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:3px}
  .warn{background:#fff4e6;border:1px solid #ffd591;border-radius:10px;padding:10px 12px;
    font-size:12.5px;color:#ad6800;margin:16px 0;line-height:1.7}
  label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:600}
  textarea,input{width:100%;padding:11px 12px;border:1.5px solid #d6e6e4;border-radius:10px;
    font-size:14px;outline:none;font-family:inherit;transition:.2s}
  textarea{resize:vertical;min-height:90px;font-family:monospace;font-size:12px}
  textarea:focus,input:focus{border-color:var(--main)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;
    background:var(--main);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
  .btn:hover{background:var(--main2)}
  .result{margin-top:18px;background:var(--bg);border-radius:10px;padding:14px;display:none}
  .result.show{display:block}
  .result .lbl{font-size:12px;color:var(--mut);margin-bottom:6px}
  .result .url{font-size:13px;color:var(--main2);word-break:break-all;line-height:1.6}
  .result .copy{margin-top:10px;font-size:13px;color:var(--main);cursor:pointer;font-weight:600}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">授权链接生成器<small>仅限老板本机使用 · 私钥不出本电脑</small></div>
  <div class="warn">⚠️ 私钥只在本页内存中用于签名，<b>不会上传任何服务器</b>。请勿把私钥发给任何人，也不要在他人电脑上打开此工具。</div>

  <label>私钥（PKCS8 PEM，从 xy-private-key.pem 复制）</label>
  <textarea id="priv" placeholder="-----BEGIN PRIVATE KEY----- ..."></textarea>
  <div class="chk"><input type="checkbox" id="remember"><label for="remember" style="margin:0">记住私钥到本机浏览器（仅这台电脑，下次免粘贴）</label></div>

  <label>员工设备授权码（让员工从工作台复制发你）</label>
  <input type="text" id="dev" placeholder="例如：a1b2c3d4-...">

  <div class="chk" style="margin-top:14px">
    <input type="checkbox" id="bindMode">
    <label for="bindMode" style="margin:0;cursor:pointer">📌 临时绑定链接：对方点一次自动绑其设备，无需回传设备码</label>
  </div>

  <div class="row">
    <div>
      <label>用途（选填）</label>
      <input type="text" id="purpose" placeholder="如：教练-张三">
    </div>
    <div>
      <label>有效天数（0 = 永久，推荐）</label>
      <input type="number" id="days" value="0" min="0" max="3650">
    </div>
  </div>

  <div class="row" style="margin-top:0">
    <div>
      <label>角色权限</label>
      <select id="role" style="width:100%;padding:11px 12px;border:1.5px solid #d6e6e4;border-radius:10px;font-size:14px;outline:none;font-family:inherit;background:#fff">
        <option value="boss">老板（全量）</option>
        <option value="coach">教练</option>
        <option value="admin">教务</option>
      </select>
    </div>
    <div style="flex:0"></div>
  </div>

  <label>GitHub 写凭证（细粒度 Token · 选填，建议填）</label>
  <input type="text" id="gt" placeholder="gho_xxx 或 github_pat_xxx（只限本仓库 contents:write）">
  <div class="chk"><input type="checkbox" id="rememberGt"><label for="rememberGt" style="margin:0">记住写凭证到本机浏览器（下次免粘贴）</label></div>
  <div class="warn" style="margin-top:8px">📌 填了它，员工点链接进来就能<b>直接把体测/上课记录写回云端主档</b>（全自动，员工不用点任何同步按钮）。不填则员工只能看、不能写。生成后此凭证随授权链接下发，请勿泄露给无关人员。</div>

  <div class="row" id="bindRow" style="display:none;margin-top:0">
    <div>
      <label>链接有效期（小时，默认24）</label>
      <input type="number" id="hours" value="24" min="1" max="168">
    </div>
    <div>
      <label>授权时长（0 = 永久）</label>
      <input type="number" id="bindDays" value="0" min="0" max="3650">
    </div>
  </div>

  <label>工作台基地址</label>
  <input type="text" id="base" value="https://xytyymq.github.io/xingyi-workbench/">

  <button class="btn" id="gen">生成授权链接</button>
  <div class="warn" id="bindTip" style="display:none;margin-top:12px">
    💡 绑定模式：把链接微信发给对方，<b>他点开一次即自动绑定其手机</b>，以后永久进入。链接仅在生成后指定小时内可点击绑定；若他清了浏览器缓存，重发同一条链接（24小时内）即可重新绑。
  </div>
  <div class="err" id="err"></div>

  <div class="result" id="result">
    <div class="lbl">把下面链接微信发给员工，他点开即进入（仅其设备有效）：</div>
    <div class="url" id="url"></div>
    <div class="copy" id="copy">📋 复制链接</div>
  </div>
</div>

<script>
  function b64urlEncodeBytes(bytes){
    var s=''; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function pemToBuf(pem){
    var b64=pem.replace(/-----BEGIN[A-Z ]+-----/,'').replace(/-----END[A-Z ]+-----/,'').replace(/\s+/g,'');
    var bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return bytes;
  }

  // 记住私钥 / 写凭证到本机浏览器（下次打开直接用，只填设备码即可）
  var saved = localStorage.getItem('xy_gen_priv');
  if (saved) { document.getElementById('priv').value = saved; document.getElementById('remember').checked = true; }
  var savedGt = localStorage.getItem('xy_gen_gt');
  if (savedGt) { document.getElementById('gt').value = savedGt; document.getElementById('rememberGt').checked = true; }

  // 绑定模式切换
  var bindMode = document.getElementById('bindMode');
  var bindRow = document.getElementById('bindRow');
  var bindTip = document.getElementById('bindTip');
  var devInput = document.getElementById('dev');
  bindMode.addEventListener('change', function(){
    if (bindMode.checked){
      bindRow.style.display = 'flex';
      bindTip.style.display = 'block';
      devInput.disabled = true;
      devInput.style.background = '#f1f1f1';
      devInput.placeholder = '绑定模式无需设备码';
    } else {
      bindRow.style.display = 'none';
      bindTip.style.display = 'none';
      devInput.disabled = false;
      devInput.style.background = '';
      devInput.placeholder = '例如：a1b2c3d4-...';
    }
  });

  document.getElementById('gen').addEventListener('click', async function(){
    var err = document.getElementById('err');
    err.textContent='';
    var privPem = document.getElementById('priv').value.trim();
    var dev = document.getElementById('dev').value.trim();
      var purpose = document.getElementById('purpose').value.trim();
      var role = document.getElementById('role').value;
      var days = parseInt(document.getElementById('days').value,10) || 0;   // 0 = 永久
      var gt = document.getElementById('gt').value.trim();
    var base = document.getElementById('base').value.trim().replace(/\/+$/,'') + '/';
    if(!privPem){ err.textContent='请粘贴私钥'; return; }
    if(!bindMode.checked && !dev){ err.textContent='请填写员工设备授权码'; return; }
    if(document.getElementById('remember').checked){ localStorage.setItem('xy_gen_priv', privPem); }
    else { localStorage.removeItem('xy_gen_priv'); }
    if(document.getElementById('rememberGt').checked && gt){ localStorage.setItem('xy_gen_gt', gt); }
    else if(!document.getElementById('rememberGt').checked){ localStorage.removeItem('xy_gen_gt'); }
    try{
      var priv = await crypto.subtle.importKey('pkcs8', pemToBuf(privPem),
        {name:'ECDSA', namedCurve:'P-256'}, false, ['sign']);
      var payload;
      if (bindMode.checked){
        var hours = parseInt(document.getElementById('hours').value,10) || 24;
        var bindDays = parseInt(document.getElementById('bindDays').value,10) || 0;
        payload = { bind:true, e: Date.now() + hours*3600000, fe: bindDays>0 ? Date.now()+bindDays*86400000 : 0, r: role, p: purpose };
        if (gt) payload.gt = gt;
      } else {
        payload = { d: dev, e: days>0 ? Date.now()+days*86400000 : 0, r: role, p: purpose };
        if (gt) payload.gt = gt;
      }
      var data = new TextEncoder().encode(JSON.stringify(payload));
      var sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, priv, data);
      var token = b64urlEncodeBytes(data) + '.' + b64urlEncodeBytes(new Uint8Array(sig));
      var url = base + 'gate.html?token=' + encodeURIComponent(token) + '&from=' + encodeURIComponent('/index.html');
      document.getElementById('url').textContent = url;
      document.getElementById('result').classList.add('show');
    }catch(e){
      err.textContent='生成失败：'+ (e && e.message ? e.message : e) + '（私钥格式是否正确？需 PKCS8 PEM）';
    }
  });

  document.getElementById('copy').addEventListener('click', function(){
    var u = document.getElementById('url').textContent;
    navigator.clipboard.writeText(u).then(function(){
      document.getElementById('copy').textContent='✓ 已复制';
      setTimeout(function(){ document.getElementById('copy').textContent='📋 复制链接'; }, 2000);
    });
  });
</script>
</body>
</html>
