<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>试课预约看板 · 星羿羽毛球馆</title>
<link rel="icon" href="data:,">
  <style>
  :root{
    --ink:#0f201d; --sub:#5b6b67; --muted:#8aa09a;
    --teal-900:#0b3d38; --teal-700:#0f766e; --teal-500:#14b8a6; --teal-100:#d6f3ec;
    --mint-50:#f1faf7; --card:#ffffff; --line:#e3ece9;
    --coral:#ef7d4f; --coral-soft:#fdeee6;
    --gold:#e0a93b; --good:#16a34a; --bad:#dc2626;
    --radius:16px; --shadow:0 2px 10px rgba(15,32,29,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--mint-50);color:var(--ink);line-height:1.65;font-size:15px;}

  .xy-topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .xy-topbar .brand{font-weight:800;font-size:14px;color:var(--teal-700);letter-spacing:.3px;}
  .xy-topbar .brand .em{margin-right:5px;}
  .xy-topbar .tag{font-size:11px;color:var(--teal-700);background:var(--teal-100);padding:4px 10px;border-radius:20px;font-weight:700;}
  .xy-topbar a.back{font-size:11px;color:var(--sub);text-decoration:none;font-weight:700;
    background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:20px;}

  .xy-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--teal-900),var(--teal-700) 55%,var(--teal-500));
    color:#fff;padding:26px 20px 24px;}
  .xy-hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
    background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.7) 22px 23px);}
  .xy-hero>*{position:relative;z-index:1;}
  .xy-hero h1{margin:0;font-size:clamp(19px,5.2vw,24px);font-weight:800;letter-spacing:.5px;}
  .xy-hero p{margin:8px 0 0;font-size:12.5px;opacity:.92;}

  .xy-wrap{max-width:680px;margin:0 auto;padding-bottom:40px;}
  .today-strip{display:flex;gap:10px;flex-wrap:wrap;margin:22px 16px 0;}
  .today-badge{flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 10px;text-align:center;box-shadow:var(--shadow);}
  .today-badge .tb-num{font-size:22px;font-weight:800;color:var(--teal-700);line-height:1.3;}
  .today-badge .tb-label{font-size:11px;color:var(--muted);margin-top:2px;}
  .today-badge.warn{border-color:var(--coral);background:var(--coral-soft);}
  .today-badge.warn .tb-num{color:var(--coral);}
  .today-badge.good{border-color:var(--good);background:#f0fdf4;}
  .today-badge.good .tb-num{color:var(--good);}

  .xy-sec{margin:26px 16px 0;}
  .xy-sec-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--teal-700);margin:0 0 12px;}
  .xy-sec-title .bar{width:4px;height:18px;background:var(--coral);border-radius:3px;}
  .xy-sec-title .hint{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:auto;}
  .xy-sec-title button{font-size:11.5px;font-weight:700;color:var(--teal-700);background:var(--teal-100);
    border:none;border-radius:20px;padding:5px 12px;cursor:pointer;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--ink);}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:9px 0;border-bottom:1px dashed var(--line);}
  .row:last-child{border-bottom:none;}
  .row .k{font-weight:700;font-size:14px;}
  .row .v{font-size:13px;color:var(--sub);text-align:right;}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;
    background:var(--teal-100);color:var(--teal-700);margin-left:6px;vertical-align:middle;}
  .tag.warn{background:var(--coral-soft);color:var(--coral);}
  .tag.good{background:#f0fdf4;color:var(--good);}
  .muted{color:var(--muted);font-size:12.5px;margin:8px 0 0;}
  .err{background:var(--coral-soft);border:1px solid var(--coral);border-radius:12px;padding:12px 14px;
    font-size:12.5px;color:#8a3a12;}
  .meta{font-size:11px;color:var(--muted);}
  #updatedAt{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;}

  .rep-btn{font-size:11px;font-weight:700;color:#fff;background:var(--teal-700);border:none;
    border-radius:20px;padding:5px 12px;cursor:pointer;margin-left:8px;}
  .rep-btn.ghost{background:var(--teal-100);color:var(--teal-700);}
  .row-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .modal-mask{display:none;position:fixed;inset:0;background:rgba(15,32,29,.45);z-index:100;
    align-items:flex-end;justify-content:center;}
  .modal-mask.open{display:flex;}
  .modal{background:var(--card);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 18px 28px;}
  .modal h3{margin:0 0 4px;font-size:16px;color:var(--teal-700);}
  .modal .sub{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .f-item label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .f-item input,.f-item select,.f-item textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);}
  .f-item input:focus,.f-item select:focus,.f-item textarea:focus{border-color:var(--teal-500);}
  .f-full{grid-column:1/-1;}
  .f-sec{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--coral);margin-top:4px;}
  .f-actions{display:flex;gap:10px;margin-top:16px;}
  .f-actions button{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .f-actions .save{background:var(--teal-700);color:#fff;}
  .f-actions .cancel{background:var(--mint-50);color:var(--sub);border:1px solid var(--line);}
  </style>
</head>
<body>

<div class="xy-topbar">
  <span class="brand"><span class="em">🏸</span>星羿 · 全馆工作台</span>
  <span class="tag">📞 试课看板</span>
  <a class="back" href="index.html">← 返回总览</a>
</div>

<header class="xy-hero">
  <h1>试课预约看板</h1>
  <p>家长在试课系统里点一点，这里实时出现 · 每 30 秒自动刷新</p>
</header>

<div class="xy-wrap">
  <div class="today-strip">
    <a class="today-badge" id="stBook">
      <div class="tb-num">–</div>
      <div class="tb-label">预约总数</div>
    </a>
    <a class="today-badge warn" id="stWait">
      <div class="tb-num">–</div>
      <div class="tb-label">待到店</div>
    </a>
    <a class="today-badge good" id="stRep">
      <div class="tb-num">–</div>
      <div class="tb-label">体测报告</div>
    </a>
  </div>

  <section class="xy-sec">
    <div class="xy-sec-title"><span class="bar"></span>试课预约
      <button onclick="loadAll()">🔄 刷新</button>
    </div>
    <div class="card">
      <h3>预约列表（按最新排序）</h3>
      <div id="bookList"><p class="muted">加载中…</p></div>
    </div>
  </section>

  <section class="xy-sec" style="margin-top:0;">
    <div class="xy-sec-title"><span class="bar"></span>体测报告</div>
    <div class="card">
      <h3>已提交报告</h3>
      <div id="repList"><p class="muted">加载中…</p></div>
    </div>
  </section>

  <p id="updatedAt"></p>
</div>

<!-- 写体测报告弹窗 -->
<div class="modal-mask" id="repModal">
  <div class="modal">
    <h3>📝 现场体测（教练填）</h3>
    <p class="sub" id="repWho">—</p>
    <p class="sub" style="color:var(--sub);font-size:11px;margin:-2px 0 8px;">以下为现场体测项；家长填写的孩子基础信息，请引导家长在试课系统「📋 档案」页填写。</p>
    <div class="f-grid">
      <div class="f-sec">静态体测</div>
      <div class="f-item"><label>身高（cm）</label><input id="fHeight" inputmode="decimal" placeholder="如 122"></div>
      <div class="f-item"><label>体重（kg）</label><input id="fWeight" inputmode="decimal" placeholder="如 23"></div>
      <div class="f-item"><label>柔韧性</label>
        <select id="fFlex"><option value="">未测</option><option>优</option><option>良</option><option>待提升</option></select></div>
      <div class="f-item"><label>测评日期</label><input id="fDate" type="date"></div>
      <div class="f-sec">动态体测</div>
      <div class="f-item"><label>1 分钟跳绳（个）</label><input id="fRope" inputmode="numeric" placeholder="如 85"></div>
      <div class="f-item"><label>步法敏捷</label>
        <select id="fFoot"><option value="">未测</option><option>优</option><option>良</option><option>待提升</option></select></div>
      <div class="f-item"><label>协调性球感</label>
        <select id="fCoord"><option value="">未测</option><option>优</option><option>良</option><option>待提升</option></select></div>
      <div class="f-item"><label>力量</label>
        <select id="fStr"><option value="">未测</option><option>优</option><option>良</option><option>待提升</option></select></div>
      <div class="f-item f-full"><label>教练建议（家长可见）</label>
        <textarea id="fNote" rows="3" placeholder="如：协调性很好，建议每天跳绳 100 个补力量，适合先报启蒙班打基础。"></textarea></div>
    </div>
    <div class="f-actions">
      <button class="cancel" onclick="closeRepModal()">取消</button>
      <button class="save" onclick="saveReport()">✅ 提交报告</button>
    </div>
  </div>
</div>

<script>
// ====== 配置：试课系统换地址/正式上线时，只改下面两行 ======
const TRIAL_API = "https://9246686b99f94d038839d47cccf66e4c.app.workbuddy.host";
const TRIAL_KEY = "xingyi2026";
// ==========================================================

const fmtTime = s => s ? s.replace("T", " ").slice(5, 16) : "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function statusTag(st) {
  if (st === "待到店") return '<span class="tag warn">待到店</span>';
  if (st === "已到店") return '<span class="tag good">已到店</span>';
  return '<span class="tag">' + esc(st || "—") + "</span>";
}

async function get(path) {
  const r = await fetch(TRIAL_API + path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(TRIAL_KEY));
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function loadAll() {
  const bookBox = document.getElementById("bookList");
  const repBox = document.getElementById("repList");
  try {
    const [bj, rj] = await Promise.all([get("/api/admin/bookings"), get("/api/admin/reports")]);

    // 统计
    const list = bj.bookings || [];
    const wait = list.filter(b => b.status === "待到店").length;
    document.getElementById("stBook").querySelector(".tb-num").textContent = bj.count ?? list.length;
    document.getElementById("stWait").querySelector(".tb-num").textContent = wait;
    document.getElementById("stRep").querySelector(".tb-num").textContent = rj.count ?? 0;

    // 预约列表
    bookBox.innerHTML = list.length
      ? list.map(b => {
          const sv = (rj.reports || {})[b.childId];
          const hasSurvey = !!(sv && sv.parent && sv.parent.gender);
          return '<div class="row"><span class="k">🧒 ' + esc(b.name || b.childId) +
          '<br><span class="meta">' + (b.phone ? '📞 ' + esc(b.phone) + ' · ' : '') + fmtTime(b.createdAt) + "</span></span>" +
          '<span class="v"><span class="row-actions">' + esc(b.time) + statusTag(b.status) +
          '<span class="tag ' + (hasSurvey ? "good" : "warn") + '">问卷' + (hasSurvey ? "✅" : "⚪") + '</span>' +
          '<button class="rep-btn" onclick="openRepModal(\'' + esc(b.childId) + '\',\'' + esc(b.name || "") + '\')">📝 报告</button>' +
          "</span></span></div>"; }).join("")
      : '<p class="muted">还没有预约。把试课页发给家长，他们点选时段提交后，这里立刻出现。</p>';

    // 报告列表（含名字反查 + 编辑入口）
    const reps = rj.reports || {};
    const nameOf = id => { const b = list.find(x => x.childId === id); return b ? (b.name || id) : id; };
    const ids = Object.keys(reps);
    repBox.innerHTML = ids.length
      ? ids.map(id => {
          const rp = reps[id] || {};
          const entries = rp.entries || [];
          const last = entries[entries.length - 1] || {};
          const summary = entries.length
            ? '身高 ' + esc(last.height || "—") + ' · 跳绳 ' + esc(last.rope || "—") +
              ' · 协调 ' + esc(last.coord || "—") + (last.note ? '<br><span class="meta">💬 ' + esc(last.note) + "</span>" : "")
            : "（旧版单条报告）" + fmtTime(rp.updatedAt);
          return '<div class="row" style="display:block"><span class="k">🧒 ' + esc(nameOf(id)) +
            ' <span class="tag">' + (entries.length ? entries.length + " 次测评" : "1 条") + "</span>" +
            ' <button class="rep-btn ghost" onclick="openRepModal(\'' + esc(id) + '\',\'' + esc(nameOf(id)) + '\')">✏️ 补填/修改</button></span>' +
            '<div class="meta">' + (entries.length ? "最近测评 " + esc(last.date || fmtTime(rp.updatedAt)) + "<br>" : "") + summary +
            (rp.parent && rp.parent.gender ? ' · 家长问卷✅' : ' · 家长问卷⚪') + "</div></div>";
        }).join("")
      : '<p class="muted">还没有体测报告。点上方预约记录里的「📝 报告」，试课后 1 分钟填完，家长端立刻可见。</p>';

    document.getElementById("updatedAt").textContent =
      "更新于 " + new Date().toLocaleTimeString("zh-CN") + " · 数据源：试课系统后端";
  } catch (e) {
    bookBox.innerHTML = '<div class="err">⚠️ 拉不到试课系统数据（' + esc(e.message) +
      '）。多半是临时后端地址变了——改本页顶部 TRIAL_API 一行即可。</div>';
    repBox.innerHTML = "";
  }
}

loadAll();
setInterval(loadAll, 30000);

// ====== 写体测报告 ======
let repChildId = null;
function openRepModal(childId, name) {
  repChildId = childId;
  document.getElementById("repWho").textContent = "孩子：" + (name || childId) + "（编号 " + childId + "）· 提交后家长端「报告/成长」页立刻可见";
  document.getElementById("fDate").value = new Date().toISOString().slice(0, 10);
  document.getElementById("repModal").classList.add("open");
}
function closeRepModal() { document.getElementById("repModal").classList.remove("open"); }

async function saveReport() {
  if (!repChildId) return;
  const v = id => document.getElementById(id).value.trim();
  const entry = {
    date: v("fDate") || new Date().toISOString().slice(0, 10),
    height: v("fHeight"), weight: v("fWeight"), flexibility: v("fFlex"),
    rope: v("fRope"), footwork: v("fFoot"), coord: v("fCoord"), strength: v("fStr"),
    note: v("fNote")
  };
  if (!entry.height && !entry.rope && !entry.coord && !entry.note) {
    alert("至少填一项（身高 / 跳绳 / 协调性 / 建议）"); return;
  }
  try {
    // 拉旧报告，把本次追加到 entries 历史（家长端成长页按次展示）
    let old = null;
    try {
      const r = await fetch(TRIAL_API + "/api/report?childId=" + encodeURIComponent(repChildId));
      if (r.ok) { const j = await r.json(); old = j.report || null; }
    } catch (e) { /* 拉不到就当首次 */ }
    const entries = (old && old.entries) ? old.entries : [];
    entries.push(entry);
    const payload = { ...(old || {}), entries, updatedAt: new Date().toISOString() };
    const p = await fetch(TRIAL_API + "/api/report", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ childId: repChildId, report: payload })
    });
    if (!p.ok) throw new Error("HTTP " + p.status);
    closeRepModal();
    alert("✅ 报告已提交，家长端立刻可见");
    loadAll();
  } catch (e) {
    alert("⚠️ 提交失败（" + e.message + "），请检查后端地址或稍后重试");
  }
}
</script>
</body>
</html>
