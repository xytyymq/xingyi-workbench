<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星羿 · 教练课时统计</title>
<style>
  :root{--g1:#0f9d58;--g2:#34c759;--o:#ff7a18;--ink:#1f2a37;--mut:#8a93a2;--bg:#f4f7f5;--card:#fff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC",Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding:14px;max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  header .logo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 22%,var(--o) 24% 38%,var(--g1) 40%);box-shadow:0 1px 4px rgba(0,0,0,.15)}
  h1{font-size:18px}
  .meta{color:var(--mut);font-size:12px;margin:2px 0 12px}
  .kpis{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .kpi{flex:1;min-width:84px;background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .kpi b{display:block;font-size:20px;color:var(--g1)}
  .kpi span{font-size:11px;color:var(--mut)}
  .controls{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  select{flex:1;padding:9px 10px;border:1px solid #d8e0db;border-radius:10px;font-size:14px;background:#fff}
  .sec{background:var(--card);border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .sec h2{font-size:14px;margin-bottom:10px;color:var(--g1)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;text-align:center;border-bottom:1px solid #eef1ef}
  th{color:var(--mut);font-weight:600}
  td.name,th.name{text-align:left;font-weight:600}
  tr.total td{font-weight:700;background:#f0faf4}
  .bar{display:inline-block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--g2),var(--g1));min-width:2px;vertical-align:-2px;margin-right:6px}
  .barcell{text-align:left;min-width:90px;white-space:nowrap}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px}
  .note{font-size:12px;color:var(--o);background:#fff6ee;border-radius:10px;padding:9px 10px;margin-bottom:12px}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:18px}
  .shade{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--g1);opacity:.18;margin-right:4px}
</style>
</head>
<body>
<header><div class="logo"></div><h1>教练课时统计</h1></header>
<div class="meta" id="meta"></div>
<div id="warn"></div>
<div class="controls">
  <select id="coachSel"><option value="__ALL__">全部教练</option></select>
</div>
<div class="kpis" id="kpis"></div>
<div class="sec"><h2>📅 按月统计（算工资看这里：60元/节 × 当月节数）</h2><div id="monthly"></div><div id="monthlyDetail"></div></div>
<div class="sec"><h2>教练 × 时段 课时分布</h2><div id="cross"></div></div>
<div class="sec"><h2 id="matrixTitle">按日期 × 时段 明细</h2><div id="matrix"></div></div>

<script>
const DATA = {"updated": "2026-10-31 23:04", "scopeFrom": "2026-09-01", "slots": ["早上10点", "下午2点", "下午4点", "下午6点", "成人班1V4", "成人班1V1", "未录"], "coaches": {"瞿佳康": {"total": 41, "byDate": {"10.8": 1, "10.24": 3, "10.3": 2, "10.11": 3, "10.7": 1, "10.17": 4, "10.25": 4, "10.31": 4, "10.18": 4, "10.10": 1, "10.16": 1, "10.22": 1, "10.28": 1, "10.20": 2, "10.4": 1, "10.14": 1, "10.13": 1, "10.29": 2, "10.23": 1, "10.1": 1, "10.27": 1, "10.9": 1}, "bySlot": {"下午6点": 17, "成人班1V1": 4, "早上10点": 6, "下午4点": 9, "成人班1V4": 3, "下午2点": 2}, "byDateSlot": {"10.8": {"下午6点": 1}, "10.24": {"下午6点": 1, "下午4点": 1, "早上10点": 1}, "10.3": {"成人班1V1": 1, "下午4点": 1}, "10.11": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "10.7": {"下午4点": 1}, "10.17": {"下午6点": 1, "成人班1V4": 1, "下午4点": 1, "早上10点": 1}, "10.25": {"下午4点": 1, "下午2点": 1, "早上10点": 1, "下午6点": 1}, "10.31": {"下午6点": 1, "早上10点": 1, "成人班1V1": 1, "下午4点": 1}, "10.18": {"下午4点": 1, "早上10点": 1, "下午2点": 1, "下午6点": 1}, "10.10": {"下午6点": 1}, "10.16": {"下午6点": 1}, "10.22": {"下午6点": 1}, "10.28": {"成人班1V1": 1}, "10.20": {"下午6点": 1, "成人班1V4": 1}, "10.4": {"下午4点": 1}, "10.14": {"成人班1V1": 1}, "10.13": {"下午6点": 1}, "10.29": {"下午6点": 1, "成人班1V4": 1}, "10.23": {"下午6点": 1}, "10.1": {"下午6点": 1}, "10.27": {"下午6点": 1}, "10.9": {"下午6点": 1}}, "byMonth": {"2026-10": 41}, "byMonthSlot": {"2026-10": {"下午6点": 17, "成人班1V1": 4, "早上10点": 6, "下午4点": 9, "成人班1V4": 3, "下午2点": 2}}}, "张玉玲": {"total": 74, "byDate": {"9.10": 1, "9.19": 3, "9.29": 1, "10.4": 2, "10.18": 3, "9.12": 3, "10.8": 1, "10.24": 3, "9.27": 3, "10.11": 2, "9.5": 3, "10.16": 1, "10.7": 3, "9.6": 3, "9.24": 1, "9.1": 1, "10.25": 2, "10.6": 3, "9.13": 3, "9.3": 1, "10.17": 3, "10.31": 2, "9.26": 3, "9.4": 1, "10.10": 1, "10.30": 1, "10.1": 1, "10.5": 2, "9.8": 1, "10.3": 2, "10.2": 2, "10.27": 1, "10.20": 1, "9.11": 1, "10.13": 1, "9.22": 1, "10.23": 1, "10.22": 1, "9.25": 1, "10.15": 1, "9.17": 1, "9.18": 1, "9.15": 1}, "bySlot": {"下午6点": 37, "早上10点": 19, "下午4点": 18}, "byDateSlot": {"9.10": {"下午6点": 1}, "9.19": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "9.29": {"下午6点": 1}, "10.4": {"早上10点": 1, "下午4点": 1}, "10.18": {"下午6点": 1, "下午4点": 1, "早上10点": 1}, "9.12": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "10.8": {"下午6点": 1}, "10.24": {"下午6点": 1, "下午4点": 1, "早上10点": 1}, "9.27": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "10.11": {"早上10点": 1, "下午4点": 1}, "9.5": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "10.16": {"下午6点": 1}, "10.7": {"下午4点": 1, "早上10点": 1, "下午6点": 1}, "9.6": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "9.24": {"下午6点": 1}, "9.1": {"下午6点": 1}, "10.25": {"下午4点": 1, "早上10点": 1}, "10.6": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "9.13": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "9.3": {"下午6点": 1}, "10.17": {"下午4点": 1, "早上10点": 1, "下午6点": 1}, "10.31": {"早上10点": 1, "下午6点": 1}, "9.26": {"早上10点": 1, "下午6点": 1, "下午4点": 1}, "9.4": {"下午6点": 1}, "10.10": {"下午6点": 1}, "10.30": {"下午6点": 1}, "10.1": {"下午6点": 1}, "10.5": {"早上10点": 1, "下午4点": 1}, "9.8": {"下午6点": 1}, "10.3": {"下午4点": 1, "早上10点": 1}, "10.2": {"下午4点": 1, "早上10点": 1}, "10.27": {"下午6点": 1}, "10.20": {"下午6点": 1}, "9.11": {"下午6点": 1}, "10.13": {"下午6点": 1}, "9.22": {"下午6点": 1}, "10.23": {"下午6点": 1}, "10.22": {"下午6点": 1}, "9.25": {"下午6点": 1}, "10.15": {"下午6点": 1}, "9.17": {"下午6点": 1}, "9.18": {"下午6点": 1}, "9.15": {"下午6点": 1}}, "byMonth": {"2026-09": 34, "2026-10": 40}, "byMonthSlot": {"2026-09": {"下午6点": 20, "早上10点": 7, "下午4点": 7}, "2026-10": {"早上10点": 12, "下午6点": 17, "下午4点": 11}}}, "瞿佳康 张玉玲": {"total": 3, "byDate": {"10.24": 2, "10.18": 1}, "bySlot": {"下午4点": 1, "下午6点": 2}, "byDateSlot": {"10.24": {"下午4点": 1, "下午6点": 1}, "10.18": {"下午6点": 1}}, "byMonth": {"2026-10": 3}, "byMonthSlot": {"2026-10": {"下午4点": 1, "下午6点": 2}}}}, "dates": ["9.1", "9.3", "9.4", "9.5", "9.6", "9.8", "9.10", "9.11", "9.12", "9.13", "9.15", "9.17", "9.18", "9.19", "9.22", "9.24", "9.25", "9.26", "9.27", "9.29", "10.1", "10.2", "10.3", "10.4", "10.5", "10.6", "10.7", "10.8", "10.9", "10.10", "10.11", "10.13", "10.14", "10.15", "10.16", "10.17", "10.18", "10.20", "10.22", "10.23", "10.24", "10.25", "10.27", "10.28", "10.29", "10.30", "10.31"], "months": ["2026-09", "2026-10"], "byMonth": {"2026-10": 84, "2026-09": 34}, "unknownDates": 13, "skippedPre": 182};
const SLOTS = DATA.slots.filter(s=>s!=="未录");
const SLOT_COLORS = {"早上10点":"#0f9d58","下午2点":"#34c759","下午4点":"#ffb020","下午6点":"#ff7a18","成人班1V4":"#5b8def","成人班1V1":"#9b6dff"};
function fmtD(k){const p=k.split(".");return p.length===2?p[0]+"月"+p[1]+"日":k;}
function fmtM(m){const p=m.split("-");return p[0]+"年"+parseInt(p[1],10)+"月";}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

document.getElementById("meta").textContent = "更新于 "+DATA.updated+" · 共 "+DATA.dates.length+" 个上课日 · 统计区间：2026年9月起 · 口径：一个时间段=1课时（按教练×日期×时段去重，算工资用）";

// 教练下拉
const sel=document.getElementById("coachSel");
Object.keys(DATA.coaches).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c+"（"+DATA.coaches[c].total+"节）";sel.appendChild(o);});
sel.addEventListener("change",()=>render(sel.value));

function coachList(filter){
  let names=Object.keys(DATA.coaches);
  if(filter && filter!=="__ALL__") names=names.filter(n=>n===filter);
  return names.sort((a,b)=>DATA.coaches[b].total-DATA.coaches[a].total);
}

function renderKpis(filter){
  const names=coachList(filter);
  let total=0,days=new Set();
  names.forEach(n=>{total+=DATA.coaches[n].total;Object.keys(DATA.coaches[n].byDate).forEach(d=>days.add(d));});
  const now=new Date();
  const curM=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const monthV=names.reduce((a,n)=>a+((DATA.coaches[n].byMonth||{})[curM]||0),0);
  const kpis=[
    ["总课时",total+" 节"],
    ["本月课时",monthV+" 节"],
    ["教练",names.length+" 人"],
    ["上课日",days.size+" 天"],
    ["时段档",SLOTS.length+" 类"],
  ];
  document.getElementById("kpis").innerHTML=kpis.map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("");
}

function renderMonthly(filter){
  const names=coachList(filter);
  const MS=DATA.months||[];
  const box=document.getElementById("monthly");
  const det=document.getElementById("monthlyDetail");
  det.innerHTML="";
  if(!MS.length){box.innerHTML="<div class='empty'>暂无数据</div>";return;}
  const rowTot=MS.map(m=>names.reduce((a,n)=>a+((DATA.coaches[n].byMonth||{})[m]||0),0));
  const maxTot=Math.max(1,...rowTot);
  let html="<table><tr><th class='name'>月份</th>"+names.map(n=>`<th>${esc(n)}</th>`).join("")+"<th>合计</th></tr>";
  MS.forEach((m,mi)=>{
    html+=`<tr><td class='name'>${fmtM(m)}</td>`;
    names.forEach(n=>{const v=(DATA.coaches[n].byMonth||{})[m]||0;html+=`<td>${v||""}</td>`;});
    const t=rowTot[mi];
    html+=`<td class='barcell'><div class='bar' style='width:${Math.max(2,Math.round(t/maxTot*70))}px'></div><b>${t}</b></td></tr>`;
  });
  html+="<tr class='total'><td class='name'>总计</td>"+names.map(n=>`<td>${DATA.coaches[n].total}</td>`).join("")+`<td>${names.reduce((a,n)=>a+DATA.coaches[n].total,0)}</td></tr>`;
  html+="</table>";
  box.innerHTML=html;
  if(names.length===1) renderMonthlyDetail(names[0]);
}

function renderMonthlyDetail(n){
  const c=DATA.coaches[n];
  if(!c||!(DATA.months||[]).length){document.getElementById("monthlyDetail").innerHTML="";return;}
  let html="<div style='font-size:12px;color:var(--mut);margin:10px 0 6px'>"+esc(n)+" · 按月 × 时段（补录核对用）</div>";
  html+="<table><tr><th class='name'>月份</th>"+SLOTS.map(s=>`<th>${esc(s)}</th>`).join("")+"<th>未录</th><th>合计</th></tr>";
  DATA.months.forEach(m=>{
    const ms=(c.byMonthSlot||{})[m]||{};let row=0;
    html+=`<tr><td class='name'>${fmtM(m)}</td>`;
    SLOTS.forEach(s=>{const v=ms[s]||0;row+=v;html+=`<td>${v||""}</td>`;});
    const un=ms["未录"]||0;row+=un;
    html+=`<td>${un||""}</td><td><b>${row}</b></td></tr>`;
  });
  html+="</table>";
  document.getElementById("monthlyDetail").innerHTML=html;
}

function renderCross(filter){
  const names=coachList(filter);
  let html="<table><tr><th class='name'>教练</th>"+SLOTS.map(s=>`<th>${esc(s)}</th>`).join("")+"<th>未录</th><th>合计</th></tr>";
  let tot=[0]*(SLOTS.length+1);
  names.forEach(n=>{
    const c=DATA.coaches[n];let row=0;
    html+="<tr><td class='name'>"+esc(n)+"</td>";
    SLOTS.forEach((s,i)=>{const v=c.bySlot[s]||0;tot[i]+=v;row+=v;html+=`<td>${v||""}</td>`;});
    const un=c.bySlot["未录"]||0;tot[SLOTS.length]+=un;row+=un;
    html+=`<td>${un||""}</td><td>${row}</td></tr>`;
  });
  if(names.length>1){
    html+="<tr class='total'><td class='name'>合计</td>";
    tot.forEach(v=>html+=`<td>${v}</td>`);
    html+="</tr>";
  }
  html+="</table>";
  // 图例
  html+="<div class='legend'>"+SLOTS.map(s=>`<span><i style="background:${SLOT_COLORS[s]}"></i>${esc(s)}</span>`).join("")+"</div>";
  document.getElementById("cross").innerHTML=html;
}

function renderMatrix(filter){
  const names=coachList(filter);
  if(names.length>1){
    document.getElementById("matrixTitle").textContent="按日期 × 时段 明细（请选择单个教练）";
    document.getElementById("matrix").innerHTML="<div class='empty'>在上方选择一位教练，查看其每日各时段的课时明细</div>";
    return;
  }
  const n=names[0];const c=DATA.coaches[n];
  document.getElementById("matrixTitle").textContent=n+" · 每日 × 时段 明细";
  const dates=DATA.dates.filter(d=>c.byDate[d]);
  if(!dates.length){document.getElementById("matrix").innerHTML="<div class='empty'>暂无数据</div>";return;}
  let html="<table><tr><th class='name'>日期</th>"+SLOTS.map(s=>`<th>${esc(s)}</th>`).join("")+"<th>合计</th></tr>";
  dates.forEach(d=>{
    html+="<tr><td class='name'>"+fmtD(d)+"</td>";let row=0;
    SLOTS.forEach(s=>{const v=(c.byDateSlot&&c.byDateSlot[d]&&c.byDateSlot[d][s])?1:0;row+=v;html+=`<td>${v?'✓':'·'}</td>`;});
    html+=`<td>${row}</td></tr>`;
  });
  html+="</table>";
  document.getElementById("matrix").innerHTML=html;
}

function render(filter){
  renderKpis(filter);renderMonthly(filter);renderCross(filter);renderMatrix(filter);
}
// 未录 / 口径 提示
let warns=[];
const unTotal=Object.values(DATA.coaches).reduce((a,c)=>a+(c.bySlot["未录"]||0),0);
if(unTotal>0){
  warns.push(`⚠️ 有 ${unTotal} 个「日期×时段」未录入时段（源表《学员上课记录》时段列未填），先计入"未录"档。教练补录时段后自动归位。`);
}
if(DATA.skippedPre>0){
  warns.push(`📅 已按口径仅统计 2026年9月 起的记录，更早的 ${DATA.skippedPre} 条已排除。`);
}
if(warns.length){
  document.getElementById("warn").innerHTML=warns.map(w=>`<div class="note">${w}</div>`).join("");
}
render("__ALL__");
</script>
</body>
</html>
