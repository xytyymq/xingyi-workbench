<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星羿羽毛球馆 · 荣誉证书</title>
  <script src="gate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", serif; background: #e2e8f0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

  .cert-wrap { width: 100%; max-width: 920px; }
  .toolbar { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-family: -apple-system, sans-serif; }
  .toolbar label { font-size: 13px; color: #334155; font-weight: 600; }
  .toolbar input, .toolbar select { font-size: 14px; padding: 6px 8px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-family: inherit; }
  .toolbar .btn { background: #0f766e; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .toolbar .btn:hover { background: #0d5d56; }

  .cert {
    position: relative;
    background: linear-gradient(135deg, #fffdf5 0%, #fef9ec 100%);
    border: 12px solid #0f766e;
    border-radius: 6px;
    padding: 46px 50px 40px;
    box-shadow: 0 10px 30px rgba(15,118,110,.25);
    aspect-ratio: 1.414 / 1;
    max-width: 920px;
    overflow: hidden;
  }
  .cert::before {
    content: "";
    position: absolute; inset: 14px;
    border: 2px solid #d4af37;
    border-radius: 4px;
    pointer-events: none;
  }
  .deco-top { text-align: center; color: #0f766e; font-size: 15px; letter-spacing: 6px; margin-bottom: 6px; }
  .title { text-align: center; font-size: 52px; font-weight: 700; color: #0f766e; letter-spacing: 14px; margin: 4px 0 2px; text-indent: 14px; }
  .subtitle { text-align: center; font-size: 14px; color: #b45309; letter-spacing: 3px; margin-bottom: 26px; }

  .body-text { text-align: center; font-size: 22px; color: #1f2933; line-height: 2.2; margin: 10px 0 18px; }
  .name { display: inline-block; min-width: 180px; border-bottom: 2.5px solid #0f766e; font-size: 30px; font-weight: 700; color: #0f766e; padding: 0 10px; margin: 0 6px; vertical-align: -4px; text-align: center; }
  .name-input { border: none; border-bottom: 2.5px solid #0f766e; background: transparent; font-family: inherit; font-size: 30px; font-weight: 700; color: #0f766e; width: 200px; text-align: center; outline: none; }
  .level-badge { display: inline-block; background: linear-gradient(135deg,#fbbf24,#d97706); color: #fff; font-size: 30px; font-weight: 700; padding: 4px 20px; border-radius: 30px; margin: 0 6px; box-shadow: 0 3px 10px rgba(217,119,6,.4); vertical-align: -3px; letter-spacing: 2px; }

  .line2 { text-align: center; font-size: 18px; color: #475569; line-height: 2; margin: 14px 0 6px; }
  .encourage { text-align: center; font-size: 16px; color: #92400e; font-style: italic; margin-top: 8px; }

  .footer-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 36px; padding: 0 10px; }
  .date { font-size: 15px; color: #334155; }
  .sign { text-align: center; }
  .sign .sig-line { width: 150px; border-bottom: 1.5px solid #475569; margin-bottom: 4px; height: 26px; }
  .sign .sig-label { font-size: 13px; color: #64748b; }

  .seal {
    position: absolute; right: 60px; bottom: 56px;
    width: 118px; height: 118px; border-radius: 50%;
    border: 3px solid #dc2626; color: #dc2626;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(-12deg); opacity: .85;
  }
  .seal .s1 { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .seal .s2 { font-size: 11px; margin-top: 3px; }
  .seal .star { font-size: 22px; margin: 2px 0; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .cert { box-shadow: none; max-width: 100%; }
  }
</style>
<style>
:root{--teal-700:#0f766e;--teal-500:#14b8a6;--teal-100:#d6f3ec;--mint-50:#f1faf7;--line:#e3ece9;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--mint-50)!important;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
.xy-topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.xy-topbar .brand{font-weight:800;font-size:14px;color:var(--teal-700);letter-spacing:.3px;}
.xy-topbar .brand .em{margin-right:5px;}
.xy-topbar a.back{font-size:12.5px;color:var(--teal-700);text-decoration:none;font-weight:700;background:var(--teal-100);padding:5px 11px;border-radius:20px;}
.cert-wrap{max-width:920px;margin:14px auto 0;padding:0 12px;}
.toolbar{background:#fff!important;border:1px solid var(--line)!important;border-radius:14px!important;padding:14px 16px!important;margin-bottom:16px!important;box-shadow:0 2px 10px rgba(15,32,29,.06)!important;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif!important;}
.toolbar label{font-size:13px;color:#334155;font-weight:600;}
.toolbar input,.toolbar select{font-size:14px;padding:6px 8px;border:1.5px solid #cbd5e1!important;border-radius:6px;font-family:inherit;}
.toolbar .btn{background:var(--teal-700)!important;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;}
.toolbar .btn:hover{background:#0d5d56!important;}
.xy-footer{text-align:center;font-size:11.5px;color:#8aa09a;margin:28px 14px 36px;line-height:1.9;}
.xy-footer a{color:var(--teal-700);text-decoration:none;font-weight:700;}
</style>
</head>
<body>

<div class="xy-topbar">
  <span class="brand"><span class="em">🏸</span>星羿 · 招生工作台</span>
  <a class="back" href="index.html" target="_blank" rel="noopener">返回工作台</a>
</div>

<div class="cert-wrap">
  <div class="toolbar">
    <label>学员姓名：<input id="fName" value="（请填写）" oninput="document.getElementById('vName').textContent=this.value"></label>
    <label>定级称号：
      <select id="fLevel" onchange="document.getElementById('vLevel').textContent=this.value">
        <option>🌱 启蒙班（5-7岁）</option>
        <option selected>🌿 初级班（8-12岁）</option>
        <option>🦅 中级班（10-14岁）</option>
        <option>⭐ 精英班（主教练带）</option>
      </select>
    </label>
    <label>日期：<input id="fDate" value="2026年8月__日" oninput="document.getElementById('vDate').textContent=this.value"></label>
    <button class="btn" id="saveImgBtn" onclick="saveCertImage()">💾 保存为图片</button>
    <button class="btn" style="background:#64748b" onclick="window.print()">🖨️ 打印 / 存为PDF</button>
  </div>

  <div class="cert" id="cert">
    <div class="deco-top">★ 星 羿 羽 毛 球 馆 ★</div>
    <div class="title">荣誉证书</div>
    <div class="subtitle">CERTIFICATE OF ACHIEVEMENT</div>

    <div class="body-text">
      兹证明
      <span class="name" id="vName">（请填写）</span>
      小朋友
    </div>
    <div class="body-text">
      在星羿羽毛球馆定级测试中表现优异，<br>
      荣获 <span class="level-badge" id="vLevel">🌿 小羽芽（初级）</span> 称号
    </div>

    <div class="line2">
      你的每一次挥拍都在变得更强大，<br>
      继续保持热爱，下一级等你来挑战！
    </div>

    <div class="encourage">—— 汗水不会辜负每一个认真的小孩 ——</div>

    <div class="footer-row">
      <div class="date">颁发日期：<span id="vDate">2026年8月__日</span></div>
      <div class="sign">
        <div class="sig-line"></div>
        <div class="sig-label">主教练签字</div>
      </div>
    </div>

    <div class="seal">
      <div class="s1">星羿认证</div>
      <div class="star">🏸</div>
      <div class="s2">定级专用章</div>
    </div>
  </div>
</div>

<footer class="xy-footer">🏸 星羿羽毛球馆 · 荣誉证书<br><a href="index.html" target="_blank" rel="noopener">返回工作台</a></footer>

<script>
function saveCertImage(){
  var node = document.getElementById('cert');
  var btn = document.getElementById('saveImgBtn');
  var old = btn.textContent; btn.disabled = true; btn.textContent = '生成中…';
  try {
    if(typeof html2canvas !== 'function'){ throw new Error('图片库未加载，请检查网络后重试'); }
    html2canvas(node, { scale: 2, backgroundColor: null, useCORS: true, logging: false })
      .then(function(canvas){
        var name = (document.getElementById('vName').textContent || '学员').trim().replace(/[\\/:*?"<>|]/g,'');
        var dataURL = canvas.toDataURL('image/png');
        btn.disabled = false; btn.textContent = old;
        var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if(isMobile){ showCertPreview(dataURL, name); }
        else {
          var a = document.createElement('a');
          a.href = dataURL; a.download = '星羿荣誉证书_' + name + '.png';
          document.body.appendChild(a); a.click(); a.remove();
        }
      })
      .catch(function(err){ btn.disabled = false; btn.textContent = old; alert('生成图片失败：' + (err && err.message ? err.message : err)); });
  } catch(e){ btn.disabled = false; btn.textContent = old; alert('生成图片失败：' + e.message); }
}
function showCertPreview(dataURL, name){
  var mask = document.getElementById('certPreviewMask');
  if(!mask){
    mask = document.createElement('div');
    mask.id = 'certPreviewMask';
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;';
    mask.innerHTML = '<img id="certPrevImg" style="max-width:92%;max-height:72%;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.4);background:#fff;">'
      + '<div style="color:#cbd5e1;text-align:center;margin-top:12px;font-size:12.5px;">📱 手机端：长按上方图片 → 保存到相册</div>'
      + '<button id="certPrevClose" style="margin-top:14px;padding:9px 22px;border:none;border-radius:9px;background:#14b8a6;color:#fff;font-size:14px;">关闭</button>';
    document.body.appendChild(mask);
    mask.addEventListener('click', function(e){ if(e.target === mask) mask.style.display='none'; });
    document.getElementById('certPrevClose').addEventListener('click', function(){ mask.style.display='none'; });
  }
  document.getElementById('certPrevImg').src = dataURL;
  mask.style.display = 'flex';
}
</script>

</body>
</html>
