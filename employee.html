<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星羿员工工作台 · 每日填报</title>
<style>
  :root{
    --teal-600:#0f766e; --teal-700:#0d9488; --teal-100:#ccfbf1;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding:16px}
  .wrap{max-width:720px;margin:0 auto}
  header{background:linear-gradient(135deg,var(--teal-600),var(--teal-700));
    color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
  header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  header p{font-size:13px;opacity:.9;margin-top:6px}
  .tip{background:var(--teal-100);color:var(--teal-700);border-radius:12px;
    padding:10px 14px;font-size:13px;margin-bottom:14px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px}
  .panel .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .panel .ico{font-size:26px}
  .panel h3{font-size:16px;flex:1}
  .panel p{font-size:12px;color:var(--muted);margin-bottom:10px}
  .btn{display:inline-block;background:var(--teal-600);color:#fff;text-decoration:none;
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .frame iframe{display:block;width:100%;height:520px;border:0}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏸 星羿员工工作台</h1>
    <p>每日填报中心 · 下方为两张实时表格，直接填写即可</p>
  </header>

  <div class="tip">💡 表格用微信/QQ 内打开即可填写，无需反复登录。若表格区域显示登录页，说明老板还没在腾讯文档把该表设为「获得链接可编辑」。</div>

  <div class="panel">
    <div class="head">
      <div class="ico">📝</div>
      <h3>工作日报</h3>
      <a class="btn" href="https://docs.qq.com/sheet/DQmdaUnJyZUJRWWdO" target="_blank" rel="noopener">新窗口打开</a>
    </div>
    <p>下班前填写当日工作完成情况</p>
    <div class="frame">
      <iframe src="https://docs.qq.com/sheet/DQmdaUnJyZUJRWWdO?from=embed&tab=BB08J2" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <div class="panel">
    <div class="head">
      <div class="ico">🧒</div>
      <h3>学员上课记录</h3>
      <a class="btn" href="https://docs.qq.com/sheet/DQnFuTW5qc3Vod09R" target="_blank" rel="noopener">新窗口打开</a>
    </div>
    <p>每节课后填写学员出勤与表现</p>
    <div class="frame">
      <iframe src="https://docs.qq.com/sheet/DQnFuTW5qc3Vod09R?from=embed&tab=BB08J2" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <footer>星羿羽毛球馆 · 内部工具</footer>
</div>
</body>
</html>
