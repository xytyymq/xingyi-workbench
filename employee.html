<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星羿 · 员工工作台</title>
<script src="gate.js"></script>
<style>
:root{--ink:#0f201d;--sub:#5b6b67;--muted:#8aa09a;--teal-900:#0b3d38;--teal-700:#0f766e;--teal-500:#14b8a6;--teal-100:#d6f3ec;--card:#fff;--line:#e3ece9;--coral:#ef7d4f;--coral-soft:#fdeee6;--gold:#e0a93b;--good:#16a34a;--bad:#dc2626;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f1faf7;color:var(--ink);line-height:1.6;font-size:15px;max-width:680px;margin:0 auto;padding-bottom:48px;}

.xy-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.xy-topbar .brand{font-weight:800;font-size:14px;color:var(--teal-700);}
.xy-topbar a.back{font-size:12.5px;color:var(--teal-700);text-decoration:none;font-weight:700;background:var(--teal-100);padding:5px 11px;border-radius:20px;}

.header{background:linear-gradient(135deg,var(--teal-900),var(--teal-700));color:#fff;padding:22px 20px 18px;}
.header h1{margin:0;font-size:19px;font-weight:800;}
.header p{margin:6px 0 0;font-size:12.5px;opacity:.85;}
.header .who{display:inline-block;margin-top:10px;font-size:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;}

.sec{padding:18px 16px 0;}
.sec-title{font-size:15px;font-weight:800;color:var(--teal-700);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-title .bar{width:4px;height:16px;background:var(--coral);border-radius:3px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 15px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.card h3 .tag{font-size:10.5px;font-weight:700;color:var(--teal-700);background:var(--teal-100);padding:2px 8px;border-radius:10px;margin-left:auto;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;background:#fbfdfc;color:var(--ink);}
.field textarea{resize:vertical;min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal-500);background:#fff;}

.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}

.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;background:var(--teal-700);color:#fff;cursor:pointer;font-family:inherit;}
.btn:active{background:var(--teal-900);}
.btn.ghost{background:var(--teal-100);color:var(--teal-700);}

.tip{font-size:11.5px;color:var(--muted);margin-top:10px;background:#f6faf9;border-left:3px solid var(--teal-500);padding:8px 10px;border-radius:0 8px 8px 0;}

.todo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:14px;}
.todo .t-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.todo .t-row:last-child{border:none;}
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex:none;}
.todo a{color:var(--teal-700);text-decoration:none;font-weight:700;margin-left:auto;font-size:12px;}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--teal-900);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.queuebar{font-size:11.5px;color:var(--muted);text-align:center;padding:6px;}
</style>
</head>
<body>

<div class="xy-topbar">
  <span class="brand">⭐ 星羿 · 员工工作台</span>
  <a class="back" href="index.html">返回首页</a>
</div>

<div class="header">
  <h1>员工工作台</h1>
  <p>一次授权，日报 / 上课记录 / 考勤 都在这里填，不用来回跳。</p>
  <span class="who" id="who">身份：加载中…</span>
</div>

<div class="sec">
  <div class="sec-title"><span class="bar"></span>今日待办</div>
  <div class="todo">
    <div class="t-row"><span class="dot"></span>查看今日课前提醒、准备教具<span><a href="https://docs.qq.com/sheet/DQmVkaXhFYW5BbGpt" target="_blank" rel="noopener">排课表 ↗</a></span></div>
    <div class="t-row"><span class="dot"></span>填今日学员上课记录（下卡）<span><a href="#report">去填写 ↓</a></span></div>
    <div class="t-row"><span class="dot"></span>下班前填工作日报 + 本人考勤<span><a href="#daily">去填写 ↓</a></span></div>
  </div>
</div>

<!-- 学员上课记录 -->
<div class="sec" id="report">
  <div class="sec-title"><span class="bar"></span>学员上课记录</div>
  <form class="card" id="form-report" onsubmit="return submitForm('report', this)">
    <h3>🧒 上课记录<span class="tag">绩效依据</span></h3>
    <div class="row2">
      <div class="field"><label>日期</label><input type="date" name="date" required></div>
      <div class="field"><label>学员姓名</label><input type="text" name="student" placeholder="如：易子文" required></div>
    </div>
    <div class="field"><label>班级</label><input type="text" name="cls" placeholder="如：基础班 / 一对一"></div>
    <div class="row2">
      <div class="field"><label>出勤</label>
        <select name="attend"><option value="出勤">出勤</option><option value="请假">请假</option><option value="迟到">迟到</option></select>
      </div>
      <div class="field"><label>表现评分</label>
        <select name="score"><option value="优秀">优秀</option><option value="良好">良好</option><option value="一般">一般</option></select>
      </div>
    </div>
    <div class="field"><label>亮点 / 备注</label><textarea name="note" placeholder="今天进步点或需关注的事"></textarea></div>
    <button class="btn" type="submit">提交上课记录</button>
  </form>
</div>

<!-- 工作日报 -->
<div class="sec" id="daily">
  <div class="sec-title"><span class="bar"></span>工作日报</div>
  <form class="card" id="form-daily" onsubmit="return submitForm('daily', this)">
    <h3>📝 工作日报<span class="tag">下班前填</span></h3>
    <div class="row2">
      <div class="field"><label>日期</label><input type="date" name="date" required></div>
      <div class="field"><label>教练</label><input type="text" name="coach" placeholder="你的名字" required></div>
    </div>
    <div class="field"><label>今日工作</label><textarea name="work" placeholder="今天带了哪些班、做了什么" required></textarea></div>
    <div class="field"><label>问题 / 需协助</label><textarea name="help" placeholder="遇到的困难、需要老板协调的"></textarea></div>
    <button class="btn" type="submit">提交日报</button>
  </form>
</div>

<!-- 本人考勤 -->
<div class="sec">
  <div class="sec-title"><span class="bar"></span>我的考勤</div>
  <form class="card" id="form-attend" onsubmit="return submitForm('attend', this)">
    <h3>⏱️ 本人考勤<span class="tag">每日一次</span></h3>
    <div class="row2">
      <div class="field"><label>日期</label><input type="date" name="date" required></div>
      <div class="field"><label>出勤</label>
        <select name="attend"><option value="出勤">出勤</option><option value="请假">请假</option><option value="迟到">迟到</option></select>
      </div>
    </div>
    <div class="field"><label>工作时长（小时）</label><input type="number" name="hours" step="0.5" min="0" max="16" placeholder="如：6"></div>
    <button class="btn ghost" type="submit">提交考勤</button>
  </form>
  <div class="queuebar" id="queuebar"></div>
</div>

<div class="tip" style="margin:0 16px;">
  提交的数据会自动同步到后台（腾讯文档）。联网即可提交，无需反复授权。
</div>

<div class="toast" id="toast"></div>

<script>
// 提交后端：EdgeOne 函数（持有 GitHub token，前端不含任何密钥）。
// 函数部署于 xingyi-employee-api 项目，需将该项目访问保护关闭后员工页方可直连。
var API = 'https://xingyi-employee-api-l7ryyhya.edgeone.cool/api/submit';
var QKEY = 'xy_emp_queue';

function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1800); }

try { document.getElementById('who').textContent = '身份：' + (window.XYGate ? XYGate.roleName() : '员工'); } catch(e){}

document.querySelectorAll('input[type=date]').forEach(function(el){ if(!el.value) el.value = today(); });

function loadQueue(){ try { return JSON.parse(localStorage.getItem(QKEY)||'[]'); } catch(e){ return []; } }
function saveQueue(q){ localStorage.setItem(QKEY, JSON.stringify(q)); }

function updateQueueBar(){
  var q = loadQueue();
  var bar = document.getElementById('queuebar');
  if (q.length === 0){ bar.textContent = '所有提交已同步 ✓'; bar.style.color = 'var(--good)'; }
  else { bar.textContent = '待同步：'+q.length+' 条（联网后自动上报）'; bar.style.color = 'var(--muted)'; }
}

function flush(){
  var q = loadQueue();
  if (!q.length) return;
  fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ batch: q }) })
    .then(function(r){ if(r.ok){ localStorage.removeItem(QKEY); updateQueueBar(); } })
    .catch(function(){});
}

function submitForm(type, form){
  var data = {};
  new FormData(form).forEach(function(v,k){ data[k]=v; });
  data._type = type;
  data._ts = new Date().toISOString();
  var q = loadQueue();
  q.push(data);
  saveQueue(q);
  updateQueueBar();
  flush();
  form.reset();
  document.querySelectorAll('input[type=date]').forEach(function(el){ if(!el.value) el.value = today(); });
  toast('已提交 ✓（本机已存，联网即同步）');
  return false;
}

updateQueueBar();
flush();
window.addEventListener('online', flush);
</script>
</body>
</html>
