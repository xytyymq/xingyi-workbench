<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>校长日报 · 星羿全馆工作台</title>
<style>
  :root{
    --navy:#0C1C42; --navy-d:#06102C;
    --neon:#C6F94B; --cyan:#56D8F0; --orange:#FF8A3D;
    --text:#EAF1FF; --muted:#9FB0D0;
    --card:rgba(255,255,255,.055); --card-strong:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.12);
    --red:#FF6B6B; --red-bg:rgba(255,107,107,.14);
    --yellow:#FFD24D; --yellow-bg:rgba(255,210,77,.13);
    --green:#5BE584; --green-bg:rgba(91,229,132,.13);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--navy-d)}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(86,216,240,.18), transparent 45%),
      radial-gradient(120% 90% at 100% 100%, rgba(198,249,75,.10), transparent 50%),
      linear-gradient(160deg,var(--navy),var(--navy-d));
    background-attachment:fixed;
    min-height:100vh;padding-bottom:30px;
  }
  /* 顶部速度线装饰 */
  .speed-lines{position:absolute;top:0;left:0;right:0;height:6px;background:
    repeating-linear-gradient(90deg,transparent 0 14px, rgba(198,249,75,.55) 14px 16px);opacity:.5}
  /* 右下能量带 */
  .energy-band{position:fixed;right:-60px;bottom:-40px;width:240px;height:120px;
    background:linear-gradient(135deg,var(--neon),var(--cyan));
    transform:rotate(-18deg);opacity:.9;border-radius:14px;z-index:0;box-shadow:0 0 40px rgba(198,249,75,.35)}
  .energy-band::after{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.35);border-radius:10px}

  header.hero{position:relative;overflow:hidden;padding:26px 18px 30px}
  .glow{position:absolute;top:-40px;left:-30px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(86,216,240,.45),transparent 70%);filter:blur(6px)}
  /* 拍框线稿剪影 */
  .racket{position:absolute;right:14px;top:18px;width:96px;height:96px;opacity:.22}
  .hero-inner{position:relative;z-index:2;max-width:640px;margin:0 auto}
  header h1{font-size:30px;font-weight:800;color:#fff;letter-spacing:1px;line-height:1.1;
    text-shadow:0 2px 0 rgba(0,0,0,.25)}
  header h1 .neon{display:block;font-size:14px;font-weight:700;color:var(--neon);
    margin-top:8px;letter-spacing:2px;text-shadow:none}
  .sub{font-size:12.5px;color:var(--muted);margin-top:12px}
  .verdict-row{display:flex;align-items:center;gap:12px;margin-top:16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .verdict-dot{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .verdict-text{font-size:17px;font-weight:800}

  .wrap{position:relative;z-index:2;padding:14px;max-width:640px;margin:0 auto}

  /* 顶部核心 KPI 条 */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .kpi{background:var(--card-strong);border:1px solid var(--line);border-radius:14px;
    padding:12px 6px;text-align:center;backdrop-filter:blur(4px)}
  .kpi .n{font-size:18px;font-weight:800;color:var(--neon);line-height:1.1;word-break:break-all}
  .kpi .l{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.3}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px;margin-top:14px;backdrop-filter:blur(4px)}
  .panel h2{font-size:15px;font-weight:700;color:#fff;margin-bottom:11px;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .panel h2 .ico{font-size:17px}
  .pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;
    background:rgba(86,216,240,.16);color:var(--cyan);font-weight:700}
  .pill.demo{background:rgba(255,138,61,.18);color:var(--orange)}

  .item{display:flex;gap:8px;padding:9px 11px;border-radius:11px;font-size:13px;
    line-height:1.55;margin-bottom:7px;align-items:flex-start}
  .item.red{background:var(--red-bg);color:var(--red)}
  .item.yellow{background:var(--yellow-bg);color:var(--yellow)}
  .item.green{background:var(--green-bg);color:var(--green)}
  .item b{font-weight:700}
  .sub2{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0}

  .funnel-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .bar-bg{height:11px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
  .bar-fg{height:100%;background:linear-gradient(90deg,var(--neon),var(--cyan));border-radius:6px;transition:width .6s}
  .bar-txt{font-size:12px;color:var(--muted);margin-top:6px}

  .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .minicard{background:var(--card-strong);border:1px solid var(--line);border-radius:13px;padding:12px}
  .minicard .big{font-size:22px;font-weight:800;color:var(--neon)}
  .minicard .cap{font-size:11px;color:var(--muted);margin-top:4px}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line);color:var(--text)}
  th{color:var(--muted);font-weight:600;font-size:11px}
  td.up{color:var(--green);font-weight:600}
  td.down{color:var(--red);font-weight:600}

  .todo{border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.07)}
  .todo h2{color:var(--red)}
  .todo li{margin:7px 0 7px 18px;font-size:13.5px;line-height:1.55;color:#FFD9D9}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 .panel{margin-top:0}

  .foot{margin-top:20px;text-align:center;font-size:11px;color:rgba(159,176,208,.6);line-height:1.7}

  @media(max-width:520px){
    .kpi-strip{grid-template-columns:repeat(2,1fr)}
    .kpi-strip .kpi:last-child{grid-column:span 2}
    .grid2{grid-template-columns:1fr}
    header h1{font-size:25px}
  }
</style>
</head>
<body>
<div class="speed-lines"></div>
<div class="energy-band"></div>

<header class="hero">
  <div class="glow"></div>
  <svg class="racket" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2">
    <ellipse cx="42" cy="42" rx="30" ry="34"/>
    <line x1="42" y1="8" x2="42" y2="76"/><line x1="12" y1="42" x2="72" y2="42"/>
    <line x1="22" y1="22" x2="62" y2="62"/><line x1="62" y1="22" x2="22" y2="62"/>
    <line x1="42" y1="76" x2="62" y2="98"/><line x1="58" y1="80" x2="78" y2="98"/>
    <circle cx="84" cy="92" r="6"/>
  </svg>
  <div class="hero-inner">
    <h1>校长日报<span class="neon">· 每日经营 一眼清</span></h1>
    <div class="sub" id="heroWhen">加载中…</div>
    <div class="verdict-row">
      <div class="verdict-dot" id="heroDot">⚪</div>
      <div class="verdict-text" id="heroVerdict">…</div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 第一屏核心 KPI -->
  <section class="kpi-strip" id="kpiStrip">
    <div class="kpi"><div class="n" id="kTodayIncome">–</div><div class="l">今日收入</div></div>
    <div class="kpi"><div class="n" id="kRenewAmt">–</div><div class="l">本月续费额</div></div>
    <div class="kpi"><div class="n" id="kRenewCnt">–</div><div class="l">续费人数</div></div>
    <div class="kpi"><div class="n" id="kSignup">–</div><div class="l">本月报名</div></div>
    <div class="kpi"><div class="n" id="kTouch">–</div><div class="l">今日触达</div></div>
  </section>

  <!-- 续费战报条 -->
  <div class="renew-bar" id="renewBar" style="margin-top:8px;background:var(--card-strong);border:1px solid var(--line);border-left:3px solid var(--neon);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text)"></div>

  <!-- 红黄绿灯 -->
  <section class="panel">
    <h2><span class="ico">🚨</span> 红黄绿灯 <span class="pill">含数据校验</span></h2>
    <div id="lights"></div>
  </section>

  <!-- 招生漏斗 -->
  <section class="panel">
    <h2><span class="ico">📣</span> 招生漏斗</h2>
    <div class="funnel-kpis" id="funnelKpis"></div>
    <div class="bar-bg"><div class="bar-fg" id="goalBar" style="width:0%"></div></div>
    <div class="bar-txt" id="goalTxt"></div>
    <div id="staleLeads" style="margin-top:11px"></div>
  </section>

  <!-- 老板待办 -->
  <section class="panel todo">
    <h2><span class="ico">⚡</span> 老板待办（需你决策）</h2>
    <ul id="bossTodos"></ul>
  </section>

  <!-- 网格：家长沟通 / 入学视频 -->
  <div class="grid2">
    <section class="panel">
      <h2><span class="ico">📞</span> 家长沟通 & 回访 <span class="pill">含触达</span></h2>
      <div id="touchBox"></div>
      <div id="callback" style="margin-top:8px"></div>
    </section>

    <section class="panel">
      <h2><span class="ico">🎬</span> 入学视频 <span class="pill demo" id="videoPill">示例</span></h2>
      <div id="videoBox"></div>
    </section>
  </div>

  <!-- 体测进度 -->
  <section class="panel">
    <h2><span class="ico">📈</span> 体测进度 <span class="pill demo" id="ticePill">示例</span></h2>
    <div id="ticeBox"></div>
  </section>

  <!-- 教练管理 -->
  <section class="panel">
    <h2><span class="ico">👔</span> 教练管理</h2>
    <div id="coachBlock"></div>
  </section>

  <!-- 周报 -->
  <section class="panel">
    <h2><span class="ico">📊</span> 周报 · 近 7 天</h2>
    <div style="overflow-x:auto"><table id="weekTable"></table></div>
    <div id="weekSummary" style="margin-top:10px"></div>
  </section>

  <div class="foot">星羿体育 · 见证每一次成长<br>每晚 23:11 自动生成（次日 8:00 补拉）· 数据来源：校长日报 / 招生线索 / 员工日报 / 收支记账 / 巡课记录 / 上课记录 / 媒体库 / 体测档案</div>
</main>

<script>
const LIGHT_META={red:{bg:"var(--red-bg)",ico:"🔴",c:"var(--red)",t:"红灯 · 今天要过问"},
  yellow:{bg:"var(--yellow-bg)",ico:"🟡",c:"var(--yellow)",t:"黄灯 · 留意关注"},
  green:{bg:"var(--green-bg)",ico:"🟢",c:"var(--green)",t:"绿灯 · 一切正常"}};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function item(l,txt){const m=LIGHT_META[l]||LIGHT_META.green;return `<div class="item ${l}">${m.ico} <span>${esc(txt)}</span></div>`}

const DEMO={
  video:{today:3,this_week:11,this_month:42,latest_title:"小宇启蒙班第3课",latest_status:"单手持拍对拉练习 · 抖音/小红书草稿待审"},
  tice:{month_done:18,month_plan:40,rate:"85%"}
};
function demoCard(boxId,pillId,key,raw,htmlFn){
  const box=document.getElementById(boxId),pill=document.getElementById(pillId);
  const hasReal=raw&&Object.keys(raw).length>0;
  const v=Object.assign({},DEMO[key],raw||{});
  if(pill) pill.textContent=hasReal?"实时":"示例";
  box.innerHTML=htmlFn(v);
}

fetch("data/principal-report.json?ts="+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById("heroWhen").textContent=`报告时间：${esc(d.generated_at||"")} · 数据截止：${esc(d.data_date||"")}`;
  const top=d.overall||"green",m=LIGHT_META[top];
  const dot=document.getElementById("heroDot");dot.style.background=m.bg;dot.textContent=m.ico;
  document.getElementById("heroVerdict").textContent=m.t;
  document.getElementById("heroVerdict").style.color=m.c;

  // 核心 KPI 条
  const fin=d.finance||{},rn=fin.renew||{},f=d.funnel||{},touch=d.touch||{};
  const setK=(id,v)=>document.getElementById(id).textContent=v;
  setK("kTodayIncome","¥"+(fin.today_income??0));
  setK("kRenewAmt", rn.month_amount!=null?"¥"+rn.month_amount:"–");
  setK("kRenewCnt", rn.month_count!=null?rn.month_count+" 人":"–");
  setK("kSignup", (f.month_signups??0)+" 人");
  setK("kTouch", touch.count!=null?touch.count+" 位":"–");
  document.getElementById("renewBar").innerHTML=(rn.month_amount!=null)
    ?`📈 续费战报：本月 <b style="color:var(--neon)">¥${rn.month_amount}</b> · ${rn.month_count??0} 人 · 目标 ¥${rn.goal??0} · 完成率 <b style="color:${rn.goal_rate&&rn.goal_rate.indexOf('超')>=0?'var(--green)':'var(--cyan)'}">${rn.goal_rate??'–'}</b> ${rn.note||''}`
    :'📈 续费战报：待接入夜间自动化（续费台账）';

  // 红黄绿灯 + 数据交叉校验
  let lightsHtml=(d.lights||[]).map(x=>item(x.level,x.text)).join("")||'<div class="empty">今日无异常</div>';
  if(d.cross_check&&d.cross_check.length){ lightsHtml+='<div class="sub2" style="margin:6px 0 2px;font-weight:700;color:var(--muted)">数据交叉校验</div>'+d.cross_check.map(x=>item(x.level,x.text)).join(""); }
  document.getElementById("lights").innerHTML=lightsHtml;

  // 招生漏斗
  document.getElementById("funnelKpis").innerHTML=
    `<div class="kpi" style="background:transparent;border:none;padding:4px"><div class="n" style="color:var(--cyan)">${f.new_leads_today??0}</div><div class="l">今日新线索</div></div>
     <div class="kpi" style="background:transparent;border:none;padding:4px"><div class="n" style="color:${(parseFloat(f.trial_arrive_rate)||0)<80?'var(--red)':'var(--green)'}">${f.trial_arrive_rate??"–"}</div><div class="l">试课到场率(红线80%)</div></div>
     <div class="kpi" style="background:transparent;border:none;padding:4px"><div class="n">${f.month_signups??0}<span style="font-size:12px;color:var(--muted)">/10</span></div><div class="l">本月报名</div></div>`;
  const pct=Math.min(100,Math.round(((f.month_signups??0)/10)*100));
  document.getElementById("goalBar").style.width=pct+"%";
  document.getElementById("goalTxt").textContent=`月报名进度 ${f.month_signups??0}/10 人（${pct}%）· ${f.month_pace_note||""}`;
  document.getElementById("staleLeads").innerHTML=(d.stale_leads&&d.stale_leads.length)
    ?`<div class="item red">⏰ <span><b>超48h未跟进（${d.stale_leads.length}）：</b>${esc(d.stale_leads.map(x=>`${x.name}(${x.days}天)`).join("、"))}</span></div>`
    :'<div class="item green">✅ <span>线索全部在 48h 跟进时限内</span></div>';

  // 家长沟通 & 回访
  document.getElementById("touchBox").innerHTML=(touch.count!=null)
    ?`<div class="item green">📨 <span>今日家长触达 <b>${esc(touch.count)}</b> 位 · ${esc(touch.types||"")}</span></div>`+(touch.feedback?`<div class="sub2">反馈摘要：${esc(touch.feedback)}</div>`:"")
    :'<div class="sub2">今日家长触达：待接入家长消息推送记录</div>';
  document.getElementById("callback").innerHTML=d.callback
    ?`<div class="item yellow">📞 <span>随机抽查建议（核反馈）：<b>${esc(d.callback)}</b></span></div>`
    :'<div class="empty">近 7 天无上课记录，暂无抽查对象</div>';

  // 入学视频 / 体测
  demoCard('videoBox','videoPill','video',d.video,v=>`<div class="minicard"><div class="big">${v.today}</div><div class="cap">条 · 今日新增</div></div><div class="sub2">本周累计 ${v.this_week} 条 · 本月 ${v.this_month} 条</div><div class="sub2">最新：<b>${esc(v.latest_title)}</b> · ${esc(v.latest_status)}</div>`);
  demoCard('ticeBox','ticePill','tice',d.tice,v=>`<div class="minicard"><div class="big">${v.month_done}</div><div class="cap">人/月</div></div><div class="sub2">本月计划 ${v.month_plan} 人 · 达标率 ${v.rate}</div>`);

  // 教练
  document.getElementById("coachBlock").innerHTML=(d.coach&&d.coach.length)?d.coach.map(x=>item(x.level,x.text)).join(""):'<div class="empty">暂无教练数据</div>';

  // 老板待办
  document.getElementById("bossTodos").innerHTML=(d.boss_todos&&d.boss_todos.length)
    ?d.boss_todos.map(t=>`<li>${esc(t)}</li>`).join(""):'<li style="color:var(--muted)">暂无待决策事项 ✅</li>';

  // 周报
  if(d.week_rows&&d.week_rows.length){
    document.getElementById("weekTable").innerHTML=
      `<tr><th>日期</th><th>线索</th><th>试课</th><th>报名</th><th>开课</th><th>收入</th><th>支出</th></tr>`+
      d.week_rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${r.leads??0}</td><td>${r.trials??0}</td><td class="${(r.signups??0)>0?"up":""}">${r.signups??0}</td><td>${r.classes??0}</td><td class="up">${r.income??0}</td><td class="down">${r.expense??0}</td></tr>`).join("");
  }
  if(d.week_summary)document.getElementById("weekSummary").innerHTML=`<div class="sub2">${esc(d.week_summary)}</div>`;
}).catch(e=>{document.getElementById("heroVerdict").textContent="数据加载失败，稍后重试";console.error(e)});
</script>
</body>
</html>
