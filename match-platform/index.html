<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>羽毛球比赛现场管理平台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">🏸</span>
      <div>
        <div class="title">羽毛球比赛现场管理平台</div>
        <div class="subtitle" id="ctxBar">未选择赛事</div>
      </div>
    </div>
    <button class="hamburger" id="navToggle" aria-label="菜单">☰</button>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="events">赛事</button>
    <button class="tab" data-tab="roster">名单</button>
    <button class="tab" data-tab="checkin">签到</button>
    <button class="tab" data-tab="group">分组</button>
    <button class="tab" data-tab="schedule">赛程</button>
    <button class="tab" data-tab="bracket">对阵图</button>
    <button class="tab" data-tab="summary">汇总</button>
    <button class="tab" data-tab="backup">数据备份</button>
  </nav>

  <main id="view" class="view"><!-- 由 UI.render 填充 --></main>

  <div id="modal" class="modal-mask" hidden>
    <div class="modal" id="modalCard"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/checkin.js"></script>
  <script src="js/seeding.js"></script>
  <script src="js/engine-ko.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
