<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>星羿 · 学员成长卡</title>
<style>
  :root{
    --navy:#0C1C42; --navy2:#06102C; --cyan:#56D8F0; --lime:#C6F94B;
    --orange:#FF7A33; --txt:#EAF2FF; --muted:#9FB2D6; --card:#10234d;
    --line:#1d3a73; --good:#39D98A; --bad:#FF6B6B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 80% at 0% 0%,rgba(86,216,240,.18),transparent 40%),
      linear-gradient(160deg,var(--navy),var(--navy2));color:var(--txt);
    min-height:100vh;padding:14px}
  .card{max-width:480px;margin:0 auto;background:rgba(16,35,77,.55);
    border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .hero{position:relative;padding:20px 18px 16px;background:
      linear-gradient(135deg,rgba(198,249,75,.12),transparent 60%);border-bottom:1px solid var(--line)}
  .hero .name{font-size:26px;font-weight:800;color:#fff}
  .hero .name .cls{font-size:13px;color:var(--cyan);font-weight:400;margin-left:8px}
  .hero .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .hero .meta span{margin-right:12px}
  .hero .ribbon{position:absolute;right:-30px;top:14px;background:var(--lime);color:#06102C;
    font-size:11px;font-weight:700;padding:4px 36px;transform:rotate(38deg)}
  .body{padding:14px 16px 20px}
  .sec{margin-top:16px}
  .sec-t{font-size:14px;font-weight:700;color:var(--lime);border-left:4px solid var(--lime);
    padding-left:9px;margin-bottom:9px}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .chart-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .ct{font-size:13px;font-weight:600}.cu{font-size:10px;color:var(--muted)}
  .chart-svg{width:100%;height:auto;display:block}
  .ln{fill:none;stroke:var(--lime);stroke-width:2.4}
  .dot{fill:var(--cyan);stroke:#fff;stroke-width:1}
  .gl{stroke:rgba(159,178,214,.18);stroke-dasharray:3 3}
  .vlab{fill:var(--txt);font-size:9px;text-anchor:middle}
  .xlab{fill:var(--muted);font-size:9px;text-anchor:middle}
  .chart-empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;
    padding:16px;text-align:center;color:var(--muted);font-size:12px;height:150px;
    display:flex;flex-direction:column;justify-content:center;margin-bottom:10px}
  .chart-empty b{color:var(--txt);font-size:13px}
  .pending{background:rgba(255,122,51,.12);border:1px solid rgba(255,122,51,.4);
    border-radius:14px;padding:20px;text-align:center}
  .pending .big{font-size:34px}.pending .t{color:var(--orange);font-size:15px;margin-top:6px}
  .pending .d{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.7}
  .snap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:92px}
  .tile .k{font-size:11px;color:var(--muted)}.tile .v{font-size:18px;font-weight:700;color:var(--lime);margin-top:3px}
  .tile .u{font-size:10px;color:var(--muted);margin-left:2px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}.pc{background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:5px 9px;font-size:11px;color:var(--muted)}.pc b{color:var(--txt)}
  .trend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .trend .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    border-bottom:1px solid rgba(29,58,115,.4);font-size:13px}
  .trend .row:last-child{border-bottom:none}
  .imp{display:inline-block;background:rgba(198,249,75,.16);color:var(--lime);border-radius:8px;
    padding:4px 10px;font-size:12px;margin-bottom:8px}
  .up{color:var(--good)}.down{color:var(--bad)}
  .note{background:rgba(86,216,240,.08);border:1px solid rgba(86,216,240,.3);border-radius:12px;
    padding:11px 14px;font-size:13px;line-height:1.7;margin-top:6px}
  .note .h{color:var(--cyan);font-size:12px;margin-bottom:5px}
  .empty{text-align:center;color:var(--muted);margin-top:60px;font-size:15px;padding:0 20px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="app"><div class="empty">加载中…</div></div>
<div class="foot">星羿体育 · 见证每一次成长 🏸</div>

<script>
const METRICS = {
  height:{name:'身高',unit:'cm',cat:'static',better:'up'},
  weight:{name:'体重',unit:'kg',cat:'static',better:'up'},
  sitReach:{name:'坐位体前屈',unit:'cm',cat:'dynamic',better:'up'},
  singleStand:{name:'单脚站立',unit:'s',cat:'dynamic',better:'up'},
  wallSquat:{name:'靠墙静蹲',unit:'s',cat:'dynamic',better:'up'},
  standingJump:{name:'立定跳远',unit:'cm',cat:'dynamic',better:'up'},
  verticalJump:{name:'纵跳',unit:'cm',cat:'dynamic',better:'up'},
  rope:{name:'跳绳',unit:'次/分',cat:'dynamic',better:'up'},
  run50:{name:'50米跑',unit:'s',cat:'dynamic',better:'down'},
  swing15:{name:'15次挥拍',unit:'s',cat:'tech',better:'down'},
  footwork:{name:'步法敏捷',unit:'s',cat:'tech',better:'down'},
  serve:{name:'发球',unit:'个',cat:'tech',better:'up'},
  rally:{name:'连续对拉',unit:'个',cat:'tech',better:'up'},
  clear:{name:'高远球',unit:'个',cat:'tech',better:'up'},
  reaction:{name:'反应速度',unit:'ms',cat:'tech',better:'down'},
  posture:{name:'身体姿态',cat:'posture',better:null}
};
const CATS=[['static','静态指标'],['dynamic','动态指标'],['tech','技术专项']];
const NUM_KEYS=Object.keys(METRICS).filter(k=>METRICS[k].cat!=='posture');

function fmt(v){ if(v==null||!isFinite(v)) return '—'; return (Math.round(v*10)/10).toString(); }
function sortTests(s){ return (s.tests||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')); }
function numTests(s){ return (s.tests||[]).length; }

async function loadData(){
  const urls=['data/profiles.json','../data/profiles.json',
    'https://xytyymq.github.io/xingyi-workbench/data/profiles.json'];
  for(const u of urls){ try{ const r=await fetch(u); if(r.ok){ const j=await r.json();
    return Array.isArray(j)?j:(j.students||[]); } }catch(e){} }
  return null;
}
function getParam(k){ return new URLSearchParams(location.search).get(k); }

function svgLine(title,unit,pts,better){
  const W=300,H=172,padL=38,padR=14,padT=30,padB=26;
  if(!pts||pts.length<2) return `<div class="chart-empty"><b>${title}</b><span>数据不足（需≥2次体测）</span></div>`;
  const vals=pts.map(p=>p.value); let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1;} const range=mx-mn,plotW=W-padL-padR,plotH=H-padT-padB;
  const x=i=>padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1));
  const y=v=>padT+plotH-(v-mn)/range*plotH;
  let g=`<line x1="${padL}" y1="${y(mn).toFixed(1)}" x2="${W-padR}" y2="${y(mn).toFixed(1)}" class="gl"/>`;
  g+=`<line x1="${padL}" y1="${y(mx).toFixed(1)}" x2="${W-padR}" y2="${y(mx).toFixed(1)}" class="gl"/>`;
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.2" class="dot"/>`).join('');
  const vl=pts.map((p,i)=>`<text x="${x(i).toFixed(1)}" y="${(y(p.value)-7).toFixed(1)}" class="vlab">${fmt(p.value)}</text>`).join('');
  const xl=pts.map((p,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" class="xlab">${p.date.slice(5)}</text>`).join('');
  const dir=better==='up'?'↑越高越好':better==='down'?'↓越低越好':'';
  return `<div class="chart"><div class="chart-h"><span class="ct">${title}</span><span class="cu">${unit||''} ${dir}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg">${g}<path d="${path}" class="ln"/>${dots}${vl}${xl}</svg></div>`;
}
function compositeFor(s){
  const tests=sortTests(s); const range={};
  NUM_KEYS.forEach(k=>{ const vals=tests.map(t=>t.m&&t.m[k]).filter(v=>typeof v==='number'&&isFinite(v));
    if(vals.length>=2) range[k]={min:Math.min(...vals),max:Math.max(...vals)}; });
  const out=[]; tests.forEach(t=>{ let sum=0,n=0;
    NUM_KEYS.forEach(k=>{ const v=t.m&&t.m[k]; if(typeof v==='number'&&isFinite(v)&&range[k]){
      const r=range[k]; sum+=(r.max>r.min?(v-r.min)/(r.max-r.min)*100:50); n++; } });
    if(n) out.push({date:t.date,value:+(sum/n).toFixed(1)}); });
  return out;
}
function trend(s){
  const tests=sortTests(s); if(tests.length<2) return null;
  const f=tests[0],l=tests[tests.length-1]; const rows=[];
  NUM_KEYS.forEach(k=>{ const m=METRICS[k]; const a=f.m&&f.m[k],b=l.m&&l.m[k];
    if(typeof a==='number'&&isFinite(a)&&typeof b==='number'&&isFinite(b)&&a!==b){
      const delta=b-a; const imp=m.better==='up'?delta>0:delta<0;
      const pct=a!==0?Math.round(delta/a*100):0;
      rows.push({name:m.name,unit:m.unit,a,b,imp,pct}); } });
  return {rows,improved:rows.filter(r=>r.imp).length,total:rows.length};
}

function render(s){
  const tests=sortTests(s), n=tests.length, last=tests[n-1];
  const gender=s.gender?(s.gender==='男'?'男':s.gender==='女'?'女':s.gender):'—';
  const age=s.age!=null?s.age+'岁':'—';
  const drawable = n>=2;
  let h=`<div class="card"><div class="hero">
      <div class="ribbon">${drawable?'成长可见':'待积累'}</div>
      <div class="name">${s.name||'学员'}<span class="cls">${s.cls||''}</span></div>
      <div class="meta"><span>性别 ${gender}</span><span>年龄 ${age}</span><span>体测 ${n} 次</span><span>最近 ${last?last.date:'—'}</span></div>
    </div><div class="body">`;

  if(n<2){
    h+=`<div class="pending"><div class="big">📋</div>
      <div class="t">体测数据待积累（当前 ${n} 次）</div>
      <div class="d">成长曲线需至少 <b>2 次</b>体测。<br>下次训练后教练再测一次，进步曲线会自动出现。</div></div>`;
    if(n===1 && last && last.m){
      const tiles=NUM_KEYS.filter(k=>typeof last.m[k]==='number'&&isFinite(last.m[k]))
        .map(k=>`<div class="tile"><div class="k">${METRICS[k].name}</div><div class="v">${fmt(last.m[k])}<span class="u">${METRICS[k].unit}</span></div></div>`).join('');
      if(tiles) h+=`<div class="sec"><div class="sec-t">最近一次体测（${last.date}）</div><div class="snap">${tiles}</div></div>`;
      if(last.m.posture) h+=`<div class="sec"><div class="sec-t">身体姿态</div><div class="chips"><span class="pc"><b>${last.m.posture}</b></span></div></div>`;
      if(last.note) h+=`<div class="sec"><div class="sec-t">教练寄语</div><div class="note">${last.note}</div></div>`;
    }
    h+=`</div></div>`; document.getElementById('app').innerHTML=h; return;
  }

  const comp=compositeFor(s);
  h+=`<div class="sec"><div class="sec-t">综合成长指数</div>`+
    (comp.length>=2? svgLine('综合成长指数','分(自比0-100)',comp,'up')
      : `<div class="chart-empty"><b>综合成长指数</b><span>各次体测项目不重叠<br>暂无法计算</span></div>`)+`</div>`;
  CATS.forEach(([cat,label])=>{
    const keys=NUM_KEYS.filter(k=>METRICS[k].cat===cat);
    let charts='';
    keys.forEach(k=>{ const pts=tests.filter(t=>typeof(t.m&&t.m[k])==='number'&&isFinite(t.m[k])).map(t=>({date:t.date,value:t.m[k]}));
      charts+=svgLine(METRICS[k].name,METRICS[k].unit,pts,METRICS[k].better); });
    if(charts) h+=`<div class="sec"><div class="sec-t">${label}</div>${charts}</div>`;
  });
  const post=tests.filter(t=>t.m&&t.m.posture);
  if(post.length) h+=`<div class="sec"><div class="sec-t">身体姿态</div><div class="chips">`+
    post.map(t=>`<span class="pc">${t.date}：<b>${t.m.posture}</b></span>`).join('')+`</div></div>`;
  const tr=trend(s);
  if(tr){
    h+=`<div class="sec"><div class="sec-t">进步趋势</div>`;
    if(tr.total===0){
      h+=`<div class="trend"><div class="row"><span>📊 首次与最近体测暂无可比指标</span></div>
        <div class="row" style="color:var(--muted);font-size:12px;border:none">建议两次测相同项目</div></div>`;
    }else{
      h+=`<div class="trend"><span class="imp">✅ ${tr.improved}/${tr.total} 项指标进步</span>`;
      tr.rows.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
      tr.rows.forEach(r=>{ const c=r.imp?'up':'down',ar=r.imp?'▲':'▼';
        h+=`<div class="row"><span>${r.name}</span><span class="${c}">${fmt(r.a)}${r.unit}→${fmt(r.b)}${r.unit} ${ar}${r.imp?'+':''}${r.pct}%</span></div>`; });
      h+=`</div></div>`;
    }
  }
  const notes=tests.filter(t=>t.note).map(t=>`<div class="note"><div class="h">教练寄语（${t.date}）</div>${t.note}</div>`);
  if(notes.length) h+=`<div class="sec"><div class="sec-t">教练寄语</div>${notes.join('')}</div>`;
  h+=`</div></div>`;
  document.getElementById('app').innerHTML=h;
}

(async function(){
  let name=getParam('name');
  // 未指定姓名时，尝试读取家长端登录态（同源 localStorage），自动打开登录孩子的成长卡
  if(!name){
    try{ const child=JSON.parse(localStorage.getItem('trial_child')||'null');
      if(child && child.name) name=child.name; }catch(e){}
  }
  const data=await loadData();
  if(!data){ document.getElementById('app').innerHTML='<div class="empty">⚠️ 数据加载失败，请确认网络可访问星羿体测主档</div>'; return; }
  const all=data.filter(s=>(s.tests||[]).length>0);
  let s=null;
  if(name){ s=all.find(x=>(x.name||'')===name) || all.find(x=>(x.name||'').includes(name)); }
  if(!s){
    const loggedIn=(function(){try{const c=JSON.parse(localStorage.getItem('trial_child')||'null');return !!(c&&c.name);}catch(e){return false;}})();
    const names=all.map(x=>x.name).filter(Boolean).slice(0,30).join('、');
    if(!loggedIn){
      document.getElementById('app').innerHTML=`<div class="empty">🔒 请先登录星羿家长端<br><br>
        在家长端用「手机号 + 孩子姓名」登录后，<br>点「🌱 成长 → 📈 体测成长曲线」<br>即可查看孩子的专属成长卡。<br><br>
        <span style="font-size:12px;color:#9FB2D6">本页需登录后访问，保护孩子隐私</span></div>`;
    }else{
      document.getElementById('app').innerHTML=`<div class="empty">未找到「${name}」的体测记录<br><br>
        该孩子可能还没有体测数据，<br>请联系教练安排一次体测。<br><br>
        <span style="font-size:12px;color:#9FB2D6">已录入体测的学员：${names}…</span></div>`;
    }
    return;
  }
  render(s);
  // 线上（app/ 目录下）追加返回家长端入口；本地预览不添加
  if(location.pathname.indexOf('/app/')>=0){
    const back=document.createElement('a');
    back.href='index.html#/growth'; back.className='card';
    back.style.cssText='display:block;text-align:center;text-decoration:none;margin-top:12px;color:#1A56A8;font-weight:700;';
    back.textContent='← 返回家长端';
    document.getElementById('app').appendChild(back);
  }
})();
</script>
</body>
</html>
