<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星羿工作台 · 授权</title>
<script src="gate.js"></script>
<style>
  :root{ --teal-900:#0b3d38; --teal-700:#0f766e; --teal-500:#14b8a6; --teal-100:#d6f3ec; --ink:#0f201d; --sub:#5b6b67; --muted:#8aa09a; --coral:#ef7d4f; --card:#fff; --line:#e3ece9; --radius:16px; --shadow:0 2px 10px rgba(15,32,29,.06);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,var(--teal-900),var(--teal-700) 55%,var(--teal-500));color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{width:100%;max-width:380px;background:var(--card);color:var(--ink);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;}
  .head{background:linear-gradient(135deg,var(--teal-900),var(--teal-700));color:#fff;padding:22px 22px 18px;}
  .head .brand{font-weight:800;font-size:15px;letter-spacing:.4px;}
  .head .brand .em{margin-right:6px;}
  .head h1{margin:10px 0 0;font-size:21px;font-weight:800;}
  .head p{margin:6px 0 0;font-size:12.5px;opacity:.9;}
  .body{padding:20px 22px 24px;}
  .tip{font-size:12.5px;color:var(--sub);line-height:1.6;background:var(--teal-100);border-radius:12px;padding:10px 12px;margin-bottom:16px;}
  .field{display:flex;gap:8px;}
  input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;letter-spacing:1px;text-align:center;text-transform:uppercase;outline:none;transition:.2s;}
  input:focus{border-color:var(--teal-500);}
  button{padding:12px 18px;border:none;border-radius:12px;background:var(--teal-700);color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap;}
  button:active{transform:translateY(1px);}
  .err{color:var(--coral);font-size:12.5px;margin-top:10px;min-height:18px;font-weight:600;}
  .foot{margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center;}
  .ok{text-align:center;}
  .ok .big{font-size:17px;font-weight:800;color:var(--teal-700);margin-bottom:4px;}
  .ok .sub{font-size:12.5px;color:var(--sub);margin-bottom:16px;}
  .row{display:flex;gap:10px;}
  .row button{flex:1;}
  .ghost{background:#fff;color:var(--teal-700);border:1.5px solid var(--teal-100);}
</style>
</head>
<body>
  <div class="box">
    <div class="head">
      <div class="brand"><span class="em">⭐</span>星羿羽毛球馆</div>
      <h1>内部工作台 · 需要授权</h1>
      <p>仅限内部使用，转发需向管理员获取授权码</p>
    </div>
    <div class="body" id="body">
      <!-- 由脚本填充 -->
    </div>
  </div>

<script>
  (function () {
    var body = document.getElementById('body');
    var params = new URLSearchParams(location.search);
    var from = params.get('from') || 'index.html';

    function showGate() {
      body.innerHTML =
        '<div class="tip">本工作台含学员资料与内部运营数据，仅限星羿内部使用。' +
        '如未授权，请向管理员（老板）微信索取授权码后输入。</div>' +
        '<div class="field">' +
          '<input id="code" placeholder="输入授权码" autocomplete="off" inputmode="text" maxlength="20">' +
          '<button id="enter">进入</button>' +
        '</div>' +
        '<div class="err" id="err"></div>' +
        '<div class="foot">一台设备一个授权 · 转发链接需单独获取授权码</div>';
      var input = document.getElementById('code');
      var err = document.getElementById('err');
      input.focus();
      function go() {
        var v = (input.value || '').trim().toUpperCase();
        if (!v) { err.textContent = '请输入授权码'; return; }
        if (!window.XYGate) { err.textContent = '加载失败，请刷新重试'; return; }
        window.XYGate.check(v).then(function (r) {
          if (r.ok) { location.replace(from); }
          else { err.textContent = r.msg; }
        }).catch(function () { err.textContent = '当前环境不支持，请通过 https 打开'; });
      }
      document.getElementById('enter').addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    }

    function showOk() {
      body.innerHTML =
        '<div class="ok">' +
          '<div class="big">✓ 你已在本设备授权</div>' +
          '<div class="sub">可正常进入工作台，授权状态本设备记住。</div>' +
          '<div class="row">' +
            '<button id="enter2">进入工作台</button>' +
            '<button id="logout" class="ghost">退出本设备</button>' +
          '</div>' +
        '</div>';
      document.getElementById('enter2').addEventListener('click', function () { location.replace(from); });
      document.getElementById('logout').addEventListener('click', function () {
        if (window.XYGate) window.XYGate.logout();
        location.reload();
      });
    }

    if (window.XYGate && window.XYGate.authed()) { showOk(); }
    else { showGate(); }
  })();
</script>
</body>
</html>
